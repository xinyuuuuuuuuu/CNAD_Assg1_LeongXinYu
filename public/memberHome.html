<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap Link -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous" defer></script>

  <!-- JQuery Link -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/4f6d96e165.js" crossorigin="anonymous"></script>

  <!-- Page Name -->
  <title>ElectricR</title>

  <!-- Linking CSS -->
  <link rel="stylesheet" href="./styles/styles.css" />

  <!-- Add a favicon to the tab bar -->
  <link rel="icon" type="image/x-icon" href="./img/ElectricR-logo.png" />
</head>

<body>
  <!-- Header -->
  <header>
    <!-- Navbar -->
    <div id="navbar-container"></div>
  </header>

  <!-- Transparent Row with Small Height at the Top -->
  <div class="row" style="width: 10vw; height: 50px; background-color: transparent"></div>

  <!-- Main Content Container -->
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 mt-5">
        <!-- Load customAlert.html dynamically -->
        <div id="customAlertContainer"></div>

        <!-- ######################################## INSERT PAGE'S CONTENT HERE \/ ########################################################### -->
        <h1>Welcome to ElectricR</h1>
        <!-- p Subtitle -->
        <p class="mb-3">
          Paving the way for a greener future with sustainable eco-friendly car rentals.
        </p>

        <!-- Button Group -->
        <div class="d-flex justify-content-center gap-3 mt-4">
          <a href="viewAccount.html" class="btn btn-primary btn-lg"><i class="fas fa-user"></i> View Account</a>
          <a href="bookVehicle.html" class="btn btn-success btn-lg"><i class="fas fa-car"></i> Book Vehicle</a>
          <a href="myReservations.html" class="btn btn-warning btn-lg"><i class="fas fa-list"></i> My Reservations</a>
          <a href="rentalHistory.html" class="btn btn-info btn-lg"><i class="fas fa-history"></i> Rental History</a>
          <a href="billinghistory.html" class="btn btn-secondary btn-lg"><i class="fas fa-file-invoice-dollar"></i> Billing History</a>
        </div>

        <!-- Logout Button -->
        <div class="mt-4">
          <button class="btn btn-danger btn-lg" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- ######################################## END OF PAGE'S CONTENT ########################################################### -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bd-footer">
    <div id="footer-container" class="container py-4 py-md-5 px-4 px-md-3 text-body-secondary"></div>
  </footer>

  <script>
    // Logout function
    function logout() {
      // Remove auth token from local storage
      localStorage.removeItem("authToken");

      // Optionally, redirect to login page
      window.location.href = "index.html";
    }
  </script>

</body>

</html>
