<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <title>Rental History</title>
  </head>

  <body>
    <div class="container text-center mt-5">
      <!-- Back Button -->
      <button class="btn btn-secondary mb-3" onclick="window.history.back()">
        Back
      </button>

      <h1 class="mb-3">Rental History</h1>

      <!-- Message for No Rental History -->
      <div
        id="no-rental-history-message"
        class="alert alert-info"
        style="display: none"
      >
        No completed reservations found.
      </div>

      <table
        class="table table-striped mt-3"
        id="rental-history-table-container"
      >
        <thead>
          <tr>
            <th>Reservation ID</th>
            <th>Vehicle</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Total Cost</th>
          </tr>
        </thead>
        <tbody id="rentalHistoryTable"></tbody>
      </table>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("authToken"); // Fetching correct token key
        console.log("[DEBUG] Token:", token);

        if (!token) {
          alert("You are not logged in!");
          window.location.href = "login.html";
          return;
        }

        console.log("[DEBUG] Fetching rental history...");
        try {
          const response = await fetch(
            "http://localhost:8081/get-rental-history",
            {
              method: "GET",
              headers: {
                Authorization: "Bearer " + token,
                Accept: "application/json",
              },
            }
          );

          console.log("[DEBUG] Response Status:", response.status);
          const responseText = await response.text();
          console.log("[DEBUG] Raw Response:", responseText);

          if (response.status === 401) {
            alert("Session expired. Please log in again.");
            localStorage.removeItem("authToken");
            window.location.href = "login.html";
            return;
          }

          let rentalHistory;
          try {
            rentalHistory = JSON.parse(responseText);
          } catch (error) {
            throw new Error("Server returned invalid JSON: " + responseText);
          }

          if (!response.ok) {
            throw new Error(
              rentalHistory.message || "Failed to fetch rental history"
            );
          }

          console.log("[DEBUG] Retrieved Rental History:", rentalHistory);

          const tableBody = document.getElementById("rentalHistoryTable");
          const noHistoryMessage = document.getElementById(
            "no-rental-history-message"
          );

          // Display message if no rental history exists
          if (
            rentalHistory.message &&
            rentalHistory.message === "No rental history found"
          ) {
            noHistoryMessage.style.display = "block";
            tableBody.innerHTML = "";
          } else if (Array.isArray(rentalHistory) && rentalHistory.length > 0) {
            noHistoryMessage.style.display = "none";
            tableBody.innerHTML = "";
            rentalHistory.forEach((res) => {
              const row = document.createElement("tr");
              row.innerHTML = `
                <td>${res.reservation_id}</td>
                <td>${res.vehicle_make} ${res.vehicle_model} (${res.license_plate})</td>
                <td>${new Date(res.reserve_start_date).toLocaleString()}</td>
                <td>${new Date(res.reserve_end_date).toLocaleString()}</td>
                <td>$${res.estimated_total_cost.toFixed(2)}</td>
              `;
              tableBody.appendChild(row);
            });
          } else {
            console.error("Unexpected response format:", rentalHistory);
            alert("Failed to load rental history. Please try again later.");
          }
        } catch (error) {
          console.error("[ERROR] Error fetching rental history:", error);
          alert(error.message);
        }
      });
    </script>
  </body>
</html>
