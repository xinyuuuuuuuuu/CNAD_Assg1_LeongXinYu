<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"
        defer></script>

    <title>ElectricR - Sign Up</title>
</head>

<body>
    <div class="container text-center mt-5">
        <!-- Back to Home Button -->
        <div class="text-start mb-3">
            <button class="btn btn-secondary" onclick="goBackToHome()">⬅ Back to Home</button>
        </div>

        <h1 class="mb-3">Sign Up</h1>
        <form id="signupForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="Full Name" required />
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" required />
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="contact" placeholder="Contact Number" required />
            </div>
            <div class="mb-3">
                <input type="date" class="form-control" id="dob" required />
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="address" placeholder="Address" required />
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required />
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </div>

    <script>
        function goBackToHome() {
            window.location.href = "index.html"; // Change if your home page is different
        }

        document.getElementById('signupForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            console.log("[DEBUG] Form submission started");

            const dobValue = new Date(document.getElementById('dob').value);
            const formattedDob = dobValue.toISOString().split("T")[0]; // Convert to YYYY-MM-DD

            const user = {
                Name: document.getElementById('name').value.trim(),
                Email: document.getElementById('email').value.trim(),
                ContactNo: document.getElementById('contact').value.trim(),
                Dob: formattedDob,
                Address: document.getElementById('address').value.trim(),
                HashedPassword: document.getElementById('password').value.trim(),
            };

            console.log("[DEBUG] User data to be sent:", JSON.stringify(user));

            try {
                const response = await fetch('http://localhost:8080/signup', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user),
                });

                console.log("[DEBUG] Response status:", response.status);

                const responseBody = await response.text();
                console.log("[DEBUG] Raw Response:", responseBody);

                let data;
                try {
                    data = JSON.parse(responseBody);
                    console.log("[DEBUG] Parsed Response Data:", data);
                } catch (error) {
                    console.error("[ERROR] JSON Parsing Error:", error);
                    throw new Error(responseBody);
                }

                if (response.ok) {
                    alert(data.message);
                    window.location.href = 'login.html';
                } else {
                    console.error("[ERROR] Server responded with an error:", data);
                    alert(data.error || 'Sign-up failed');
                }
            } catch (error) {
                console.error("[ERROR] Fetch request failed:", error);
                alert(error.message || 'An error occurred during sign-up');
            }
        });

    </script>
</body>

</html>
