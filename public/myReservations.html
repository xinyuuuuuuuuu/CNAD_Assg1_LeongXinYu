<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bootstrap Link -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <title>View Reservations</title>
</head>

<body>
  <div class="container text-center mt-5">
    <!-- Back Button -->
    <button class="btn btn-secondary mb-3" onclick="window.history.back()">Back</button>

    <h1 class="mb-3">Your Reservations</h1>

    <!-- Message for No Reservations -->
    <div id="no-reservations-message" class="alert alert-info" style="display: none;">
      You have no active or pending reservations.
    </div>

    <table class="table table-striped mt-3" id="reservations-table-container">
      <thead>
        <tr>
          <th>Reservation ID</th>
          <th>Vehicle Make</th>
          <th>Vehicle Model</th>
          <th>Vehicle Type</th>
          <th>License Plate</th>
          <th>Status</th>
          <th>Start Date & Time</th>
          <th>End Date & Time</th>
          <th>Total Cost</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="reservations-table"></tbody>
    </table>
  </div>

  <!-- Update Modal -->
  <div class="modal fade" id="updateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Reservation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="updateForm">
            <div class="mb-3">
              <label for="updateStartDate" class="form-label">Start Date & Time</label>
              <input type="datetime-local" id="updateStartDate" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="updateEndDate" class="form-label">End Date & Time</label>
              <input type="datetime-local" id="updateEndDate" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary">Update Reservation</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Helper function: converts an ISO date string to "yyyy-MM-ddThh:mm" (local) format.
    function formatForDatetimeLocal(dateStr) {
      const date = new Date(dateStr);
      const pad = (num) => num.toString().padStart(2, '0');
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      const hours = pad(date.getHours());
      const minutes = pad(date.getMinutes());
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("authToken"); // Fetching correct token key
      console.log("[DEBUG] Token:", token);

      if (!token) {
        alert("You are not logged in!");
        window.location.href = "login.html";
        return;
      }

      console.log("[DEBUG] Fetching reservations...");
      try {
        const response = await fetch("http://localhost:8081/get-reservations", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json",
          },
        });

        console.log("[DEBUG] Response Status:", response.status);
        const responseText = await response.text();
        console.log("[DEBUG] Raw Response:", responseText);

        if (response.status === 401) {
          alert("Session expired. Please log in again.");
          localStorage.removeItem("authToken");
          window.location.href = "login.html";
          return;
        }

        let reservations;
        try {
          reservations = JSON.parse(responseText);
        } catch (error) {
          throw new Error("Server returned invalid JSON: " + responseText);
        }

        if (!response.ok) {
          throw new Error(reservations.message || "Failed to fetch reservations");
        }

        console.log("[DEBUG] Retrieved Reservations:", reservations);

        const tableBody = document.getElementById("reservations-table");
        const noReservationsMessage = document.getElementById("no-reservations-message");

        // Display message if no reservations exist
        if (reservations.message && reservations.message === "No reservations found") {
          noReservationsMessage.style.display = "block";
          tableBody.innerHTML = "";
        } else if (Array.isArray(reservations) && reservations.length > 0) {
          noReservationsMessage.style.display = "none";
          tableBody.innerHTML = "";
          reservations.forEach((res) => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${res.reservation_id}</td>
              <td>${res.vehicle_make}</td>
              <td>${res.vehicle_model}</td>
              <td>${res.vehicle_type}</td>
              <td>${res.license_plate}</td>
              <td>${res.reserve_status}</td>
              <td>${new Date(res.reserve_start_date).toLocaleString()}</td>
              <td>${new Date(res.reserve_end_date).toLocaleString()}</td>
              <td>$${res.estimated_total_cost.toFixed(2)}</td>
              <td>
                <button class="btn btn-danger" onclick="cancelReservation(${res.reservation_id})">Cancel</button>
                <button class="btn btn-warning" onclick="openUpdateModal(${res.reservation_id}, '${res.reserve_start_date}', '${res.reserve_end_date}')">Update</button>
                <button class="btn btn-success" onclick="proceedToPayment(${res.reservation_id})">Proceed to Payment</button>
              </td>
            `;
            tableBody.appendChild(row);
          });
        } else {
          console.error("Unexpected response format:", reservations);
          alert("Failed to load reservations. Please try again later.");
        }
      } catch (error) {
        console.error("[ERROR] Error fetching reservations:", error);
        alert(error.message);
      }
    });

    function proceedToPayment(reservationId) {
      window.location.href = `billing.html?reservation_id=${reservationId}`;
    }

    async function cancelReservation(reservationId) {
      if (!confirm("Are you sure you want to cancel this reservation?")) return;

      try {
        const response = await fetch("http://localhost:8081/delete-reservations", {
          method: "DELETE",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken"),
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ reservation_id: reservationId }),
        });

        if (!response.ok) {
          throw new Error("Failed to cancel reservation");
        }
        alert("Reservation cancelled successfully");
        location.reload();
      } catch (error) {
        console.error("[ERROR] Error canceling reservation:", error);
        alert(error.message);
      }
    }

    function openUpdateModal(reservationId, startDate, endDate) {
      // Convert the ISO dates to the correct datetime-local format
      const formattedStart = formatForDatetimeLocal(startDate);
      const formattedEnd = formatForDatetimeLocal(endDate);
      document.getElementById("updateStartDate").value = formattedStart;
      document.getElementById("updateEndDate").value = formattedEnd;
      // Set the onsubmit handler with the reservation ID
      document.getElementById("updateForm").onsubmit = function (e) {
        e.preventDefault();
        updateReservation(reservationId);
      };
      // Show the modal
      new bootstrap.Modal(document.getElementById("updateModal")).show();
    }

    async function updateReservation(reservationId) {
      // Get the value from the inputs (which are in "yyyy-MM-ddThh:mm" format)
      const startDateInput = document.getElementById("updateStartDate").value;
      const endDateInput = document.getElementById("updateEndDate").value;
      // Convert to ISO strings so they conform to RFC3339 (with seconds and timezone)
      const startDateISO = new Date(startDateInput).toISOString();
      const endDateISO = new Date(endDateInput).toISOString();

      try {
        const response = await fetch("http://localhost:8081/update-reservations", {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken"),
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            reservation_id: reservationId,
            reserve_start_date: startDateISO,
            reserve_end_date: endDateISO,
          }),
        });

        if (!response.ok) {
          throw new Error("Failed to update reservation");
        }
        alert("Reservation updated successfully");
        location.reload();
      } catch (error) {
        console.error("[ERROR] Error updating reservation:", error);
        alert(error.message);
      }
    }
  </script>

</body>

</html>
