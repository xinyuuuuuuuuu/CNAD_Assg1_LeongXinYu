<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ElectricR</title>
    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
      crossorigin="anonymous"
    />
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
      crossorigin="anonymous" 
      defer
    ></script>
</head>
<body>
    <div class="container text-center mt-5">
        <!-- Back to Home Button -->
        <div class="text-start mb-3">
            <button class="btn btn-secondary" onclick="goBackToHome()">⬅ Back to Home</button>
        </div>

        <h2>Login to ElectricR</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p id="errorMessage" class="text-danger mt-3" style="display: none;"></p>
    </div>

    <script>
        function goBackToHome() {
            window.location.href = "index.html"; // Change if your home page is different
        }

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const loginData = {
                "email": email,
                "hashed_password": password
            };

            try {
                const response = await fetch("http://localhost:8080/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem("authToken", data.Token);
                    window.location.href = "memberHome.html";
                } else {
                    document.getElementById("errorMessage").textContent = data.message || "Login failed. Please try again.";
                    document.getElementById("errorMessage").style.display = "block";
                }
            } catch (error) {
                document.getElementById("errorMessage").textContent = "An error occurred. Please try again later.";
                document.getElementById("errorMessage").style.display = "block";
            }
        });
    </script>
</body>
</html>
