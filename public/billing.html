<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <title>Billing Summary</title>
</head>

<body>
    <div class="container text-center mt-5">
        <!-- Back to Home Button -->
        <div class="text-start mb-3">
            <button class="btn btn-secondary" onclick="goBackToHome()">⬅ Back to Home</button>
        </div>

        <h1 class="mb-3">Billing Summary</h1>

        <!-- Billing Details -->
        <div id="billing-details">
            <p><strong>Reservation ID:</strong> <span id="reservation-id"></span></p>
            <p><strong>Payment Status:</strong> <span id="payment-status"></span></p>
            <p><strong>Billing Date:</strong> <span id="billing-date"></span></p>
        </div>

        <!-- Billing Cost Breakdown -->
        <div id="billing-summary" class="mt-4">
            <h4>Billing Breakdown</h4>
            <p><strong>Total Cost:</strong> $<span id="total-cost"></span></p>
            <p><strong>Promo Discount:</strong> <span id="promo-discount"></span></p>
            <p><strong>Final Amount:</strong> $<span id="final-amount"></span></p>
        </div>

        <!-- Proceed to Payment Button -->
        <div class="mt-4">
            <button class="btn btn-primary" id="proceed-payment" onclick="proceedToPayment()">Proceed to Payment</button>
        </div>
    </div>

    <script>
        function goBackToHome() {
            window.location.href = "memberHome.html";
        }

        let billingDetails = {};  
        let reservationId = new URLSearchParams(window.location.search).get("reservation_id");

        // ✅ Function to Convert UTC Date to Proper Local Format
        function formatDateTime(dateStr) {
            if (!dateStr) return "N/A"; 

            const date = new Date(dateStr);
            const options = { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit', 
                hour12: false, timeZone: 'Asia/Singapore' 
            };
            return new Intl.DateTimeFormat('en-GB', options).format(date).replace(",", "");
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("authToken");

            if (!token) {
                alert("You are not logged in!");
                window.location.href = "login.html";
                return;
            }

            if (!reservationId) {
                alert("Reservation ID is missing!");
                return;
            }

            console.log("[DEBUG] Fetching billing details for reservation ID:", reservationId);

            try {
                const response = await fetch(`http://localhost:8082/get-billing/${reservationId}`, {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json",
                    },
                });

                if (!response.ok) {
                    throw new Error("Failed to fetch billing details");
                }

                billingDetails = await response.json();
                console.log("[DEBUG] Retrieved billing details:", billingDetails);

                document.getElementById("reservation-id").textContent = billingDetails.reservation_id;
                document.getElementById("payment-status").textContent = billingDetails.payment_status;
                
                document.getElementById("billing-date").textContent = formatDateTime(billingDetails.billing_date);
                
                document.getElementById("total-cost").textContent = billingDetails.billing_total.toFixed(2);

                if (billingDetails.promo_discount > 0) {
                    document.getElementById("promo-discount").textContent = `-$${billingDetails.promo_discount.toFixed(2)}`;
                } else {
                    document.getElementById("promo-discount").textContent = "None";
                }

                document.getElementById("final-amount").textContent = billingDetails.billing_final.toFixed(2);

                // ✅ Disable "Proceed to Payment" button if already paid
                if (billingDetails.payment_status === "Paid") {
                    document.getElementById("proceed-payment").disabled = true;
                    document.getElementById("proceed-payment").textContent = "Payment Completed";
                }

            } catch (error) {
                console.error("[ERROR] Error fetching billing details:", error);
                alert(error.message);
            }
        });

        async function proceedToPayment() {
            if (!billingDetails || !billingDetails.reservation_id) {
                alert("Billing details are missing!");
                return;
            }

            const token = localStorage.getItem("authToken");
            const paymentMethod = prompt("Enter Payment Method (Card / PayNow):");

            if (!["Card", "PayNow"].includes(paymentMethod)) {
                alert("Invalid payment method. Please enter 'Card' or 'PayNow'.");
                return;
            }

            try {
                const response = await fetch(`http://localhost:8082/pay-unpaid-billing/${billingDetails.billing_id}`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ payment_method: paymentMethod }),
                });

                if (!response.ok) {
                    throw new Error("Payment processing failed");
                }

                const result = await response.json();
                alert(result.message);  

                // ✅ Reload page to reflect updated payment status
                location.reload();
            } catch (error) {
                console.error("[ERROR] Error processing payment:", error);
                alert(error.message);
            }
        }
    </script>

</body>

</html>
