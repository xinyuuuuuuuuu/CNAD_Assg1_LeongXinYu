<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>

  <!-- JQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/4f6d96e165.js" crossorigin="anonymous"></script>

  <!-- Page Title -->
  <title>Book Vehicle - ElectricR</title>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles/styles.css" />
  <link rel="stylesheet" href="./styles/bookVehicle.css" />
</head>

<body>
  <header>
    <div id="navbar-container"></div>
  </header>

  <div class="row" style="width: 10vw; height: 50px; background-color: transparent"></div>

  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 mt-5">
        <div id="customAlertContainer"></div>

        <h1>Book Your Vehicle</h1>
        <p class="mb-3">Choose your preferred vehicle and rental period.</p>

        <form id="bookVehicleForm" class="text-start mx-auto" style="max-width: 500px;">
          <div class="mb-3">
            <label for="vehicle" class="form-label">Select Vehicle</label>
            <select id="vehicle" class="form-select" required>
              <option value="">Loading available vehicles...</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="startDate" class="form-label">Start Date</label>
            <input type="datetime-local" id="startDate" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="endDate" class="form-label">End Date</label>
            <input type="datetime-local" id="endDate" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Book Now</button>
          <button class="btn btn-secondary mt-3" onclick="window.location.href='memberHome.html'">Back to Homepage</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="bd-footer">
    <div id="footer-container" class="container py-4 py-md-5 px-4 px-md-3 text-body-secondary"></div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("authToken"); // Fetching the correct token key
      console.log("[DEBUG] Token retrieved:", token);

      if (!token) {
        alert("You are not logged in!");
        window.location.href = "login.html";
        return;
      }

      console.log("[DEBUG] Fetching vehicles...");
      try {
        const response = await fetch("http://localhost:8081/vehicles", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json",
          },
        });

        console.log("[DEBUG] Response Status:", response.status);

        if (response.status === 200) {
          const vehicles = await response.json();
          console.log("[DEBUG] Retrieved Vehicles:", vehicles);

          const vehicleSelect = document.getElementById("vehicle");
          vehicleSelect.innerHTML = ""; // Clear the loading message

          if (Array.isArray(vehicles) && vehicles.length === 0) {
            console.log("[DEBUG] No vehicles available");
            vehicleSelect.innerHTML = `<option value="">No vehicles available</option>`;
          } else if (Array.isArray(vehicles)) {
            console.log("[DEBUG] Vehicles available, populating select dropdown...");
            vehicles.forEach((vehicle) => {
              const option = document.createElement("option");
              option.value = vehicle.vehicleId;
              option.textContent = `${vehicle.vehicleMake} ${vehicle.vehicleModel} (${vehicle.vehicleType})`;
              vehicleSelect.appendChild(option);
            });
          }
        } else {
          console.error("[ERROR] Error fetching vehicles:", response.status);
        }
      } catch (error) {
        console.error("[ERROR] Error fetching vehicles:", error);
      }

      // Handle form submission for booking a vehicle
      const form = document.getElementById("bookVehicleForm");
      form.addEventListener("submit", async (event) => {
        event.preventDefault(); // Prevent the default form submission

        const vehicleId = document.getElementById("vehicle").value;
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;

        console.log("[DEBUG] Form values - VehicleId:", vehicleId, "Start Date:", startDate, "End Date:", endDate);

        // Ensure that all fields are filled out
        if (!vehicleId || !startDate || !endDate) {
          alert("Please fill in all fields.");
          console.error("[DEBUG] Missing fields - VehicleId:", vehicleId, "Start Date:", startDate, "End Date:", endDate);
          return;
        }

        // Validate that the vehicleId is a valid number greater than 0
        if (parseInt(vehicleId) <= 0) {
          alert("Please select a valid vehicle.");
          console.error("[DEBUG] Invalid VehicleId:", vehicleId);
          return;
        }

        // Log the data to be sent to the backend
        console.log("[DEBUG] Making reservation with data:", {
          vehicle_id: vehicleId,
          reserve_start_date: startDate,
          reserve_end_date: endDate
        });

        // Note the keys here now match the Go struct's JSON tags (snake_case)
        const reservationData = {
          vehicle_id: parseInt(vehicleId),
          reserve_start_date: new Date(startDate).toISOString(),
          reserve_end_date: new Date(endDate).toISOString(),
        };

        console.log("[DEBUG] Reservation Data Sent:", reservationData); // Log the reservation data

        try {
          const reservationResponse = await fetch("http://localhost:8081/make-reservations", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(reservationData),
          });

          console.log("[DEBUG] Reservation Response Status:", reservationResponse.status);

          if (reservationResponse.status === 200) {
            alert("Reservation successfully created!");
            window.location.href = "memberHome.html"; // Redirect to the homepage or confirmation page
          } else {
            console.error("[ERROR] Failed to make reservation. Response:", reservationResponse);
            alert("Failed to make reservation. Please try again.");
          }
        } catch (error) {
          console.error("[ERROR] Error making reservation:", error);
          alert("Error making reservation. Please try again.");
        }
      });
    });
  </script>
  
</body>

</html>
